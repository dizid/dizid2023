[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Common URLs that leads type or link to (Malt, Upwork, LinkedIn). Without these
# they fell through to the SPA fallback below and silently showed the home page.
# They must stay ABOVE the "/*" catch-all: Netlify uses the first matching rule.
[[redirects]]
  from = "/pricing"
  to = "/hire#services"
  status = 301

[[redirects]]
  from = "/work"
  to = "/hire#case-studies"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.airtable.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
