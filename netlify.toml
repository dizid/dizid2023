[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Common URLs that leads type or link to (Malt, Upwork, LinkedIn). Without these
# they would fall through to the "Page not found" rule below.
# They must stay ABOVE the "/*" catch-all: Netlify uses the first matching rule.
[[redirects]]
  from = "/pricing"
  to = "/hire#services"
  status = 301

[[redirects]]
  from = "/work"
  to = "/hire#case-studies"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

# Every real page is a prerendered file (vite-ssg), and Netlify serves a file before
# this rule. Anything else gets the "Page not found" page with a real 404 status
# (it used to get the home HTML with 200, which rendered a blank page).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.airtable.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
